apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  namespace: demo
  name: httpbin
spec:
  parentRefs:
  - name: apisix
    namespace: ingress-apisix
  hostnames:
  - httpbin.local
  rules:
  - matches:
    - path:
        type: PathPrefix
        value: /
    backendRefs:
    - name: httpbin
      port: 80
